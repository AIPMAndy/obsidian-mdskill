<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Theme Style Test</title>
</head>
<body>

<h2>Test 1: Playful Theme (多彩活力)</h2>
<style>
.mdskill-preview {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.9;color:#2c2c2c;max-width:700px;margin:0 auto;padding:56px 48px;background:#fefdfb;}
.mdskill-preview h1{font-family:Georgia,"Noto Serif SC",serif;font-size:36px;font-weight:700;color:#1a1a1a;margin:0 0 32px;}
.mdskill-preview h2{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:26px;font-weight:700;color:#0066cc;margin:48px 0 20px;border-bottom:2px solid #0066cc;padding-bottom:8px;}
.mdskill-preview p{margin:20px 0;line-height:1.9;}
.mdskill-preview blockquote{margin:22px 0;padding:16px 18px;border-left:4px solid #d4af37;background:#fffbf0;color:#4a4a4a;font-style:normal;}
.mdskill-preview strong{font-weight:bold;color:#1a1a1a;}
</style>
<div class="mdskill-preview">
<h1>测试标题 H1</h1>
<h2>测试标题 H2</h2>
<p>这是一个测试段落，用来验证样式是否正确应用。</p>
<blockquote>这是一个引用块</blockquote>
<p>文本中有 <strong>加粗内容</strong> 来测试。</p>
</div>

<hr style="margin: 60px 0;">

<h2>Test 2: Minimal Theme (极简现代)</h2>
<style>
.mdskill-preview-2 {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.9;color:#374151;max-width:680px;margin:0 auto;padding:48px 32px;background:#fafafa;}
.mdskill-preview-2 h1{font-size:36px;font-weight:800;color:#111827;margin:0 0 30px;}
.mdskill-preview-2 h2{font-size:22px;font-weight:700;color:#111827;margin:42px 0 16px;border-bottom:none;}
.mdskill-preview-2 p{margin:16px 0;line-height:1.9;}
.mdskill-preview-2 blockquote{margin:20px 0;padding:12px 16px;border-left:4px solid #111827;background:#f9fafb;color:#6b7280;font-style:normal;}
.mdskill-preview-2 strong{font-weight:bold;color:#111827;}
</style>
<div class="mdskill-preview-2">
<h1>测试标题 H1</h1>
<h2>测试标题 H2</h2>
<p>这是一个测试段落，用来验证样式是否正确应用。</p>
<blockquote>这是一个引用块</blockquote>
<p>文本中有 <strong>加粗内容</strong> 来测试。</p>
</div>

</body>
</html>
