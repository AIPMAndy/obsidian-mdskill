<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>表格渲染测试</title>
<style>
.mdskill-preview {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.9;
  color: #2c2c2c;
  max-width: 700px;
  margin: 0 auto;
  padding: 56px 48px;
  background: #fefdfb;
}
.mdskill-preview h2 {
  font-size: 26px;
  font-weight: 700;
  color: #0066cc;
  margin: 48px 0 20px;
  border-bottom: 2px solid #0066cc;
  padding-bottom: 8px;
}
.mdskill-preview p {
  margin: 20px 0;
  line-height: 1.9;
}
.mdskill-preview table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
}
.mdskill-preview th {
  background: #f5f5f5;
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
  font-weight: 600;
}
.mdskill-preview td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}
</style>
</head>
<body>
<div class="mdskill-preview">
<h2>测试表格</h2>
<table>
<thead>
<tr>
<th>方案</th>
<th>类型</th>
<th>优点</th>
<th>缺点</th>
<th>推荐度</th>
</tr>
</thead>
<tbody>
<tr>
<td>Obsidian Web Clipper</td>
<td>官方插件 + 浏览器扩展</td>
<td>官方支持，集成好</td>
<td>需要两步安装</td>
<td>⭐⭐⭐⭐</td>
</tr>
<tr>
<td>Markdownload</td>
<td>浏览器扩展</td>
<td>简单，一键下载</td>
<td>非 Obsidian 原生</td>
<td>⭐⭐⭐⭐</td>
</tr>
</tbody>
</table>
<p>这是表格后的文本。</p>
</div>
</body>
</html>
